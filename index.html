<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1b3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Qui est concerné ? — Présidentielle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <section id="screen-start" class="screen active">
    <h1>Qui est<br>concerné&nbsp;?</h1>
    <p class="sub">Présidentielle 2027</p>
    <p class="hint">Touchez <b>toutes</b> les têtes concernées. 100, puis 200, puis 300 points… Une erreur et vous ne gardez que la moitié de la cagnotte.</p>
    <div id="modes" class="modes"></div>
    <button id="btn-sound" class="sound"></button>
  </section>

  <section id="screen-game" class="screen">
    <header class="hud">
      <div><small id="hud1-label"></small><b id="hud1"></b></div>
      <div class="timer"><small id="hud2-label"></small><b id="time"></b></div>
      <div><small id="hud3-label"></small><b id="hud3"></b></div>
    </header>
    <div class="timebar"><div id="timebar-fill"></div></div>
    <div class="question">
      <p id="question"></p>
      <small id="progress"></small>
    </div>
    <div id="board" class="board"></div>
    <div id="feedback" class="feedback"></div>
    <div id="info" class="info hidden">
      <p id="info-text"></p>
      <button id="btn-next" class="big">Question suivante</button>
      <button id="btn-quit" class="big ghost hidden">Terminer la partie</button>
    </div>
    <button id="btn-stop" class="big stop"></button>
  </section>

  <section id="screen-end" class="screen">
    <h2 id="end-title"></h2>
    <p class="final"><span id="final-label"></span> : <b id="final-score">0</b></p>
    <p id="new-record" class="record hidden">Nouveau record&nbsp;!</p>
    <p class="best">Record : <span id="best-end">0</span></p>
    <p class="stats" id="stats"></p>
    <button id="btn-restart" class="big">Rejouer</button>
    <button id="btn-menu" class="big ghost">Changer de mode</button>
  </section>
</main>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
